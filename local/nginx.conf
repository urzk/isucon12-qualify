# Docker を使わずローカル(macOS)で動かすための nginx 設定
# local/run.sh から `nginx -p local/ -c nginx.conf` で起動する (相対パスは local/ 基準)
worker_processes 1;
pid run/nginx.pid;
error_log log/nginx_error.log;

events {
  worker_connections 1024;
}

http {
  include /opt/homebrew/etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log log/nginx_access.log;

  client_body_temp_path run/client_body;
  proxy_temp_path       run/proxy;
  fastcgi_temp_path     run/fastcgi;
  uwsgi_temp_path       run/uwsgi;
  scgi_temp_path        run/scgi;

  server {
    listen 443 ssl;
    http2 on;

    root ../public/;

    ssl_certificate     ../nginx/tls/fullchain.pem;
    ssl_certificate_key ../nginx/tls/key.pem;
    ssl_dhparam         ../nginx/tls/dhparam.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      try_files $uri /index.html;
    }

    location ~* /(api|initialize) {
      proxy_set_header Host $host;
      proxy_read_timeout 480;
      proxy_pass http://127.0.0.1:3100;
    }

    location /auth {
      proxy_set_header Host $host;
      proxy_pass http://127.0.0.1:3001;
    }
  }
}
