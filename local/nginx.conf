# Docker を使わずローカル(macOS)で動かすための nginx 設定
# local/run.sh から `nginx -p local/ -c nginx.conf` で起動する (相対パスは local/ 基準)
# TLS のハンドシェイクを1プロセスで捌ききれず接続がリセットされるので CPU 数だけ起動する
worker_processes auto;
pid run/nginx.pid;
error_log log/nginx_error.log;

events {
  worker_connections 4096;
}

http {
  include /opt/homebrew/etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time';
  access_log log/nginx_access.log timed;

  # webapp への接続を使い回す (リクエストごとに接続すると listen backlog があふれて 502 になる)
  upstream webapp {
    server 127.0.0.1:3100;
    keepalive 256;
  }

  client_body_temp_path run/client_body;
  proxy_temp_path       run/proxy;
  fastcgi_temp_path     run/fastcgi;
  uwsgi_temp_path       run/uwsgi;
  scgi_temp_path        run/scgi;

  server {
    listen 443 ssl;
    http2 on;

    root ../public/;

    ssl_certificate     ../nginx/tls/fullchain.pem;
    ssl_certificate_key ../nginx/tls/key.pem;
    ssl_dhparam         ../nginx/tls/dhparam.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    location / {
      try_files $uri /index.html;
    }

    location ~* /(api|initialize) {
      proxy_set_header Host $host;
      proxy_read_timeout 480;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # クライアントが切断しても webapp との keepalive 接続を切らない (切ると再接続が殺到して 502 になる)
      proxy_ignore_client_abort on;
      proxy_pass http://webapp;
    }

    location /auth {
      proxy_set_header Host $host;
      proxy_pass http://127.0.0.1:3001;
    }
  }
}
